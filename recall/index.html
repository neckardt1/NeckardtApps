<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="Recall is temporarily offline while a rebuild is underway.">
  <title>Recall · Temporarily offline</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #293d30;
      background: #f5f3eb;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 1rem; line-height: 1.55; }
    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
    }
    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 7vw, 4rem);
      background: #fffdf7;
      border: 1px solid #dedfd3;
      border-radius: 1.25rem;
      box-shadow: 0 .75rem 2.75rem #293d3008;
    }
    .eyebrow {
      display: inline-block;
      margin: 0 0 1.6rem;
      padding: .35rem .75rem;
      border-radius: 2rem;
      background: #eaf0e3;
      color: #46604b;
      font-size: .875rem;
      font-weight: 600;
    }
    h1 {
      max-width: 9em;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.65rem, 8vw, 4.25rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }
    .message { max-width: 27rem; margin: 1.5rem 0 0; color: #5b685b; font-size: 1.0625rem; }
    .return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      margin-top: 2.25rem;
      padding: .75rem 1.4rem;
      border: 1px solid #36533f;
      border-radius: .6rem;
      background: #36533f;
      color: #fffef9;
      font-weight: 600;
      text-decoration: none;
      touch-action: manipulation;
    }
    .return:hover { background: #294432; }
    .return:focus-visible { outline: 3px solid #648369; outline-offset: 4px; }
    @media (max-width: 420px) {
      .page { padding-right: 1rem; padding-left: 1rem; }
      main { padding: 2rem 1.5rem; }
      .return { width: 100%; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .return { transition: background-color 100ms ease; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <p class="eyebrow">Rebuild underway</p>
      <h1>Recall is temporarily offline.</h1>
      <p class="message">We’re rebuilding the review experience. Please check back later.</p>
      <a class="return" href="../">Return to Apps</a>
    </main>
  </div>
</body>
</html>
