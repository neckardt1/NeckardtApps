# Keep the existing local CLI stack ID so upgrades reuse its Docker volumes.
project_id = "recall-synthetic"

[functions.recall-grade]
# Edge code verifies the exact user JWT through Supabase Auth on every call;
# do not rely on the gateway's project-key check as user authentication.
verify_jwt = false

[functions.provision-worker]
# The provisioning credential is checked before any Auth admin operation.
verify_jwt = false

[functions.neckardt-apps-mcp]
# The function verifies the OAuth token on protected tool calls.
verify_jwt = false
