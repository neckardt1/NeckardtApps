name: Deploy apps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install site and backend test dependencies
        run: npm ci
      - name: Test app and Pages routes
        run: npm run check
      - name: Build public site
        env:
          VITE_CANARY_USER_DIGEST: ${{ vars.RECALL_CANARY_USER_DIGEST }}
          RECALL_LEGACY_CANARY_USER_ID: ${{ !vars.RECALL_CANARY_USER_DIGEST && vars.RECALL_CANARY_USER_ID || '' }}
          VITE_CANARY_CLIENT_ID: ${{ vars.RECALL_CANARY_CLIENT_ID }}
          VITE_CANARY_CALLBACK_URL: ${{ vars.RECALL_CANARY_CALLBACK_URL }}
          NECKARDT_APPS_SUPABASE_URL: ${{ vars.NECKARDT_APPS_SUPABASE_URL }}
          NECKARDT_APPS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NECKARDT_APPS_SUPABASE_PUBLISHABLE_KEY }}
          RECALL_SUPABASE_URL: ${{ vars.RECALL_SUPABASE_URL }}
          RECALL_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RECALL_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build --workspace @neckardt/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
