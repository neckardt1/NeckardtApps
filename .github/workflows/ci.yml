name: Pull request checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install site and backend test dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: |
          npm run typecheck
          npm test
          node scripts/build-pages.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6
      - name: Check and test the OAuth resource
        working-directory: apps/recall/supabase/functions/recall-events
        run: |
          deno check --frozen index.ts
          deno test --frozen --allow-env oauth.test.ts
